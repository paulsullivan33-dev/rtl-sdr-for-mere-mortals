site_name: RTL-SDR for Mere Mortals
site_description: Plain-language software-defined radio with a cheap USB dongle. What the receiver hears, the numbers behind tuning and sample rates, broadcast FM from the command line, aircraft decoded from a recorded slice of sky, and the sensor chatter of the 433 MHz band.
